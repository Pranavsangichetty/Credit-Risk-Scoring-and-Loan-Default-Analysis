name: Nivesh ML model execution

on:
  push:
    branches:
      - Nivesh243
    paths:
      - "src/**"
      - "requirements.txt"
      - "german_credit_data.csv"
      - ".github/workflows/nivesh-ml-execution.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute-models:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Nivesh branch
        uses: actions/checkout@v4
        with:
          ref: Nivesh243
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install tabulate
      - name: Execute hold-out baseline models
        run: python src/train_baseline.py --data german_credit_data.csv
      - name: Execute stratified 5-fold validation
        run: python src/validate_baseline.py --data german_credit_data.csv
      - name: Build result report and CSV summaries
        run: python src/build_ml_report.py
      - name: Commit verified execution outputs to Nivesh branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/metrics.json outputs/holdout_predictions.csv outputs/cross_validation_metrics.json outputs/model_comparison.csv outputs/threshold_analysis.csv outputs/subgroup_metrics.csv reports/nivesh/day5_ml_execution_results.md
          if git diff --cached --quiet; then
            echo "No generated result changes to commit."
          else
            git commit -m "Add executed ML validation results and Day 5 report"
            git push origin HEAD:Nivesh243
          fi
